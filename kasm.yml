services:
  kasm:
    image: lscr.io/linuxserver/kasm:latest
    container_name: kasm
    privileged: true
    environment:
      - KASM_PORT=3444
    volumes:
      - ${DOCKER_DIRECTORY}/kasm/data:/opt
      - ${DOCKER_DIRECTORY}/kasm/profiles:/profiles
    ports:
      - 3001:3000
      - 3444:3444
    restart: unless-stopped
